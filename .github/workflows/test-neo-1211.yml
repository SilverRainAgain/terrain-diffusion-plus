name: Test terrain tuning (Minecraft 1.21.1 NeoForge)

on:
  push:
    branches: [terrain-tuning-2026-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge / Windows DirectML distribution
        working-directory: versions/1.21.1
        run: |
          chmod +x ../../gradlew
          ../../gradlew buildNeoForgeWindows --stacktrace --no-daemon
      - name: Verify distributable JAR
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile
          candidates = [
              p for p in glob.glob('versions/1.21.1/neoforge/build/libs/*.jar')
              if 'windows' in p.lower()
              and not any(x in p.lower() for x in ('-dev.jar', '-sources.jar', '-javadoc.jar'))
          ]
          if not candidates:
              raise SystemExit('No production Windows JAR')
          verified = False
          for p in candidates:
              with zipfile.ZipFile(p) as jar:
                  paths = [n for n in jar.namelist() if n.endswith('biome_catalog.json')]
                  if not paths:
                      continue
                  catalog = json.loads(jar.read(paths[0]))
                  keys = {entry.get('key') for entry in catalog}
                  assert {'minecraft:badlands','minecraft:eroded_badlands','minecraft:wooded_badlands'} <= keys
                  assert any(n.endswith('BiomeWeightSettings.class') for n in jar.namelist())
                  assert any(n.endswith('BiomeWeightsScreen.class') for n in jar.namelist())
                  print('Validated:', p, 'biomes:', len(keys))
                  verified = True
                  break
          if not verified:
              raise SystemExit('No distributable JAR with biome catalog and new UI classes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-tuning-1.21.1-neoforge-windows
          path: versions/1.21.1/neoforge/build/libs/*windows.jar
          if-no-files-found: error
